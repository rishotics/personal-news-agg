name: Daily Edition

on:
  schedule:
    # GitHub's scheduler is best-effort. Observed behaviour on this repo:
    # ~90 min late on a good day, 9h37m late once, and outright dropped twice.
    # A single cron cannot hit a 07:00 IST deadline against that.
    #
    # So fire MANY triggers across the 03:00-07:10 IST window. --skip-if-exists
    # makes every run after the first a no-op that exits in seconds, so the
    # first trigger GitHub actually delivers publishes and the rest cost
    # nothing. One dropped or delayed trigger no longer means no newspaper.
    - cron: "31 21 * * *"   # 03:01 IST
    - cron: "49 21 * * *"   # 03:19 IST
    - cron: "11 22 * * *"   # 03:41 IST
    - cron: "33 22 * * *"   # 04:03 IST
    - cron: "51 22 * * *"   # 04:21 IST
    - cron: "13 23 * * *"   # 04:43 IST
    - cron: "37 23 * * *"   # 05:07 IST
    - cron: "59 23 * * *"   # 05:29 IST
    - cron: "21 0 * * *"    # 05:51 IST
    - cron: "43 0 * * *"    # 06:13 IST
    - cron: "7 1 * * *"     # 06:37 IST
    - cron: "29 1 * * *"    # 06:59 IST
    - cron: "53 1 * * *"    # 07:23 IST (last resort)
  workflow_dispatch:
    inputs:
      no_telegram:
        description: "Skip Telegram delivery"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          ARGS=""
          # Any scheduled run stands down if today's edition is already out.
          # Whichever of the two crons lands first publishes; the other exits
          # in seconds. Manual dispatch always regenerates.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--skip-if-exists"
          fi
          if [ "${{ inputs.no_telegram }}" = "true" ]; then
            ARGS="$ARGS --no-telegram"
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/index.html
          if git diff --staged --quiet; then
            echo "No changes to index.html; skipping commit"
          else
            git commit -m "daily edition"
            git push
          fi

      - name: Upload generated HTML as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ github.run_id }}
          path: output/*.html
          retention-days: 14
