name: Daily Edition

on:
  schedule:
    # GitHub's scheduler is best-effort and runs late: this workflow was
    # delivered ~90 minutes late on a normal day and 9h37m late once. So the
    # cron fires well BEFORE the paper is wanted, and the odd minutes avoid
    # the heavily contended :00 and :30 slots.
    # 22:47 UTC = 04:17 IST next day. Even ~90 min late it lands before 06:00
    # IST. The edition is dated in IST (see config.EDITION_TZ), so a run in the
    # 22:00-24:00 UTC window correctly dates itself to the upcoming IST day.
    - cron: "47 22 * * *"
    # 01:53 UTC = 07:23 IST. Backup for a very late or dropped primary; stands
    # down in seconds if the edition is already out.
    - cron: "53 1 * * *"
  workflow_dispatch:
    inputs:
      no_telegram:
        description: "Skip Telegram delivery"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          ARGS=""
          # Any scheduled run stands down if today's edition is already out.
          # Whichever of the two crons lands first publishes; the other exits
          # in seconds. Manual dispatch always regenerates.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="--skip-if-exists"
          fi
          if [ "${{ inputs.no_telegram }}" = "true" ]; then
            ARGS="$ARGS --no-telegram"
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/index.html
          if git diff --staged --quiet; then
            echo "No changes to index.html; skipping commit"
          else
            git commit -m "daily edition"
            git push
          fi

      - name: Upload generated HTML as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ github.run_id }}
          path: output/*.html
          retention-days: 14
